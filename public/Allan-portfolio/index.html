<!DOCTYPE html>
<html lang="en">
<head>

  <meta http-equiv="refresh" content="0; url=https://allan-kj.github.io/">
  <link rel="canonical" href="https://allan-kj.github.io/">
  <title>Allan K J</title>
  <script>
    window.location.replace("https://allan-kj.github.io/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      background-color: #07090e;
      color: #38bdf8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
      max-width: 480px;

    h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #fff;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      text-decoration: none;
      font-family: monospace;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    a:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.6);
